<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title id="pageTitle">Reporte — InversionMos</title>
  <style>
    :root{
      --paper:#fdfcf8; --paper2:#f4f1e8; --card:#fff; --ink:#1b1e26; --ink2:#565d6b; --ink3:#8b93a1;
      --line:#e7e2d6; --line2:#efe9dd;
      --green:#15803d; --greenbg:#e7f4ec; --blue:#1d4ed8; --bluebg:#e7edfb;
      --amber:#b45309; --amberbg:#fbf0dd; --indigo:#5b3fb8; --indigobg:#efe9fb; --red:#b91c1c; --redbg:#fbe4e4;
      --mono:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;
      --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--paper2);color:var(--ink);min-height:100vh;padding:16px 14px 84px;-webkit-font-smoothing:antialiased}
    .wrap{max-width:560px;margin:0 auto}

    /* header */
    .rpt-header{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
    .rpt-hd-top{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
    .rpt-hd-top.g{background:linear-gradient(180deg,var(--greenbg),var(--card))}
    .rpt-hd-top.b{background:linear-gradient(180deg,var(--bluebg),var(--card))}
    .rpt-hd-top.i{background:linear-gradient(180deg,var(--indigobg),var(--card))}
    .rpt-hd-top.a{background:linear-gradient(180deg,var(--amberbg),var(--card))}
    .rpt-brand{font-size:10px;color:var(--ink3);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .rpt-prov{font-size:22px;font-weight:900;letter-spacing:-.02em;margin-top:7px;line-height:1.12}
    .rpt-kind{font-size:14px;font-weight:700;color:var(--ink2);margin-top:4px;display:flex;align-items:center;gap:6px}
    .rpt-idrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;flex-wrap:wrap}
    .rpt-id{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--ink2)}
    .badge{font-size:12px;font-weight:800;padding:4px 12px;border-radius:99px;white-space:nowrap}
    .badge-pendiente,.badge-abierta{background:var(--amberbg);color:var(--amber)}
    .badge-procesado,.badge-cerrada{background:var(--greenbg);color:var(--green)}
    .badge-anulada{background:var(--redbg);color:var(--red)}
    /* live strip */
    .rpt-live{display:flex;align-items:center;gap:7px;padding:8px 18px;background:var(--paper2);font-size:11px;color:var(--ink2);font-weight:600}
    .rpt-live .dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:pulse 2s infinite}
    @keyframes pulse{70%{box-shadow:0 0 0 7px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}

    /* marcas guía */
    .marks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
    .mk{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;padding:8px 13px;border-radius:11px}
    .mk-ok{background:var(--greenbg);color:var(--green)} .mk-warn{background:var(--amberbg);color:var(--amber)}
    .mk-inv{background:var(--bluebg);color:var(--blue)} .mk-off{background:var(--paper2);color:var(--ink3)}

    /* post-it comentario */
    .postit{background:#fff6c9;border:1px solid #f2e39a;border-radius:5px;padding:12px 14px 13px;margin-bottom:12px;box-shadow:0 6px 18px -10px rgba(120,90,0,.4);position:relative}
    .postit::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:54px;height:14px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.05);border-radius:2px}
    .postit .pl{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#a9820c;display:flex;align-items:center;gap:5px}
    .postit .pt{font-size:14.5px;color:#4a3d10;line-height:1.5;margin-top:5px;font-style:italic}

    /* section */
    .sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:12px}
    .sec-t{font-size:11px;font-weight:800;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}
    .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .f{padding:10px 11px;background:var(--paper);border:1px solid var(--line2);border-radius:11px;transition:background .4s,border-color .4s,box-shadow .4s}
    .f.full{grid-column:1/-1}
    .f .k{font-size:9.5px;color:var(--ink3);font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
    .f .v{font-size:14.5px;font-weight:700;color:var(--ink);word-break:break-word}
    .money{font-size:26px;font-weight:900;color:var(--green);letter-spacing:-.02em}
    .money small{font-size:12px;color:var(--ink3);font-weight:700;margin-left:8px}
    @keyframes fieldPulse{0%{background:var(--paper);border-color:var(--line2)}30%{background:var(--greenbg);border-color:var(--green);box-shadow:0 0 0 3px rgba(21,128,61,.12)}100%{background:var(--paper);border-color:var(--line2)}}
    .field-changed{animation:fieldPulse 2.6s ease forwards}

    /* productos */
    .it{display:flex;align-items:center;gap:11px;padding:9px 0}
    .it+.it{border-top:1px solid var(--line2)}
    .it .dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:0 0 auto}
    .it .dot.nw{background:var(--blue)} .it .dot.q{background:var(--amber)}
    .it .nm{flex:1;min-width:0}
    .it .n1{font-size:14.5px;font-weight:700;color:var(--ink)}
    .it .n2{font-size:11px;color:var(--ink3);margin-top:2px}
    .it .fl{display:inline-block;font-size:9.5px;font-weight:900;font-style:italic;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
    .fl-nw{background:var(--bluebg);color:var(--blue)} .fl-q{background:var(--amberbg);color:var(--amber)}
    .it .qt{font-family:var(--mono);font-size:15px;font-weight:800;color:var(--ink2);white-space:nowrap}
    .it .qt small{font-size:11px;font-weight:600;color:var(--ink3)}

    /* fotos */
    .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
    .fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:zoom-in;border:1px solid var(--line);background:var(--paper2)}
    .foto-guia{width:100%;max-height:240px;object-fit:cover;border-radius:13px;cursor:zoom-in;border:1px solid var(--line)}
    .chips{display:flex;flex-wrap:wrap;gap:7px}
    .chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:10px;background:var(--paper2);color:var(--ink2)}

    /* link a entidad vinculada */
    .linkcard{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--paper2);border:1px solid var(--line);border-radius:13px;text-decoration:none;color:inherit}
    .linkcard:active{background:var(--line2)}
    .linkcard .lic{width:40px;height:40px;border-radius:11px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;flex:0 0 auto}
    .linkcard .lt{flex:1;min-width:0}
    .linkcard .lt .a{display:block;font-family:var(--mono);font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .linkcard .lt .b{display:block;font-size:12px;color:var(--ink2);margin-top:2px}
    .linkcard .go{font-size:20px;color:var(--ink3)}

    /* lightbox */
    .lightbox{display:none;position:fixed;inset:0;background:rgba(8,10,15,.94);z-index:999;align-items:center;justify-content:center;padding:14px}
    .lightbox.open{display:flex}
    .lightbox img{max-width:96vw;max-height:88vh;border-radius:12px;object-fit:contain}
    .lb-close{position:fixed;top:16px;right:16px;background:rgba(255,255,255,.12);border:none;color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;display:grid;place-items:center}

    /* footer */
    .rpt-footer{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:9px 16px}
    .rpt-progress{width:100%;max-width:560px;margin:0 auto 6px;height:3px;background:var(--line2);border-radius:2px;overflow:hidden}
    .rpt-progress-bar{height:100%;background:#22c55e;border-radius:2px;transition:width 1s linear}
    .rpt-footer-text{font-size:10.5px;color:var(--ink3);text-align:center}

    /* estados */
    .rpt-center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;gap:14px;color:var(--ink3);text-align:center;padding:24px}
    .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .rpt-err-icon{font-size:42px}.rpt-err-title{font-size:17px;font-weight:800;color:var(--red)}.rpt-err-sub{font-size:13.5px;color:var(--ink2);max-width:320px;line-height:1.5}
    .empty{color:var(--ink3);font-size:13px;font-style:italic}
    /* toast */
    .upd-toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:7px 16px;border-radius:99px;font-size:12px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:500;white-space:nowrap;box-shadow:0 8px 24px -10px rgba(0,0,0,.4)}
    .upd-toast.show{opacity:1}
  </style>
</head>
<body>

<div class="wrap" id="root">
  <div class="rpt-center" id="stLoading"><div class="spinner"></div><span>Cargando reporte…</span></div>
  <div class="rpt-center" id="stError" style="display:none">
    <div class="rpt-err-icon">⚠️</div>
    <div class="rpt-err-title" id="errTitle">Error</div>
    <div class="rpt-err-sub" id="errMsg"></div>
  </div>
  <div id="stContent" style="display:none"></div>
</div>

<div class="rpt-footer" id="footer" style="display:none">
  <div class="rpt-progress"><div class="rpt-progress-bar" id="progressBar" style="width:100%"></div></div>
  <div class="rpt-footer-text" id="footerText"></div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lb-close" onclick="closeLightbox()">×</button>
  <img id="lbImg" src="" alt="">
</div>
<div class="upd-toast" id="updToast">✓ Actualizado</div>

<script>
// ── Config ────────────────────────────────────────────────────
const REFRESH_SEC = 30;
const SB_URL  = 'https://rzbzdeipbtqkzjqdchqk.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ6YnpkZWlwYnRxa3pqcWRjaHFrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzYwMDQsImV4cCI6MjA5NjQ1MjAwNH0.MAlSdz_ugGUZoaU5st6dA_gb_x_IiUL0TXxH176kY9k';
const p    = new URLSearchParams(location.search);
const TIPO = p.get('tipo') || '';
const ID   = p.get('id')   || '';
let _last = null, _timer = null, _tick = REFRESH_SEC;

const TIPO_LBL = {
  INGRESO_PROVEEDOR:'📥 Ingreso de proveedor', INGRESO_JEFATURA:'📥 Ingreso de jefatura',
  INGRESO_DEVOLUCION_ZONA:'📥 Devolución de zona', SALIDA_ZONA:'📤 Salida a zona',
  SALIDA_DEVOLUCION:'📤 Devolución', SALIDA_JEFATURA:'📤 Salida jefatura',
  SALIDA_ENVASADO:'📤 Envasado', SALIDA_MERMA:'📤 Merma', TRANSFORMACION:'♻️ Transformación'
};

// ── Fetch ─────────────────────────────────────────────────────
async function fetchData() {
  const res = await fetch(`${SB_URL}/rest/v1/rpc/get_reporte`, {
    method: 'POST',
    headers: { apikey: SB_ANON, Authorization: 'Bearer ' + SB_ANON, 'Content-Type': 'application/json', 'Content-Profile': 'wh' },
    body: JSON.stringify({ p: { tipo: TIPO, id: ID } })
  });
  const json = await res.json();
  if (!json || !json.ok) throw new Error((json && json.error) || 'Error al obtener datos');
  return json.data;
}

async function init() {
  if (!TIPO || !ID) { showError('Enlace inválido', 'Faltan parámetros del reporte.'); return; }
  try { const data = await fetchData(); _last = data; render(data, []); startRefresh(); }
  catch(e) { showError('No se pudo cargar', e.message); }
}

// ── Refresh ───────────────────────────────────────────────────
function startRefresh() { _tick = REFRESH_SEC; updateFooter(); clearInterval(_timer); _timer = setInterval(onTick, 1000); }
async function onTick() {
  _tick--; updateFooter();
  if (_tick > 0) return;
  _tick = REFRESH_SEC;
  try { const data = await fetchData(); const changed = diff(_last, data); _last = data; render(data, changed); if (changed.length) showUpdToast(changed.length); }
  catch(e) {}
}
function updateFooter() {
  document.getElementById('progressBar').style.width = ((_tick/REFRESH_SEC)*100) + '%';
  const ago = REFRESH_SEC - _tick;
  document.getElementById('footerText').textContent = `🔄 En vivo · actualizado hace ${ago}s · próxima en ${_tick}s`;
}
function diff(prev, next) { if (!prev) return []; return Object.keys(next).filter(k => k!=='generado' && JSON.stringify(prev[k])!==JSON.stringify(next[k])); }
function pulseFields(keys) { keys.forEach(k => document.querySelectorAll('[data-key="'+k+'"]').forEach(el => { el.classList.remove('field-changed'); void el.offsetWidth; el.classList.add('field-changed'); setTimeout(()=>el.classList.remove('field-changed'),3000); })); }
function showUpdToast(n) { const t=document.getElementById('updToast'); t.textContent='✓ '+n+' cambio'+(n>1?'s':''); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500); }

// ── Render dispatch ───────────────────────────────────────────
function render(data, changed) {
  document.getElementById('stLoading').style.display='none';
  document.getElementById('stError').style.display='none';
  const ct = document.getElementById('stContent'); ct.style.display='block';
  ct.innerHTML = data.tipo === 'preingreso' ? renderPreingreso(data) : renderGuia(data);
  document.getElementById('footer').style.display='block';
  document.title = (data.tipo==='preingreso'?data.idPreingreso:data.idGuia) + ' — InversionMos';
  if (changed && changed.length) setTimeout(()=>pulseFields(changed), 60);
}
function showError(t,m){ document.getElementById('stLoading').style.display='none'; const e=document.getElementById('stError'); e.style.display='flex'; document.getElementById('errTitle').textContent=t; document.getElementById('errMsg').textContent=m||''; }

// ── Helpers ───────────────────────────────────────────────────
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function escAttr(s){ return esc(s).replace(/'/g,'&#39;'); }
function fmtMoney(n){ const v=parseFloat(n); return (!isFinite(v)||v<=0)?null:'S/ '+v.toLocaleString('es-PE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(s){ if(!s) return '—'; const raw=String(s).split(/[T ]/)[0]; const d=new Date(raw+'T12:00:00'); if(isNaN(d)) return raw; const ms=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']; return d.getDate()+' '+ms[d.getMonth()]+' '+d.getFullYear(); }
function tipoLbl(t){ return TIPO_LBL[t] || (t?String(t).replace(/_/g,' ').toLowerCase():'—'); }
function accentClass(tipoGuia, esPre){ if(esPre) return 'i'; const g=String(tipoGuia||''); if(g.indexOf('INGRESO')===0) return 'g'; if(g.indexOf('SALIDA')===0) return 'b'; return 'a'; }
function badgeClass(e){ const s=String(e||'').toLowerCase(); if(s.indexOf('cerr')===0||s.indexOf('proc')===0) return 'badge-cerrada'; if(s.indexOf('anul')===0) return 'badge-anulada'; if(s.indexOf('abier')===0||s.indexOf('pend')===0) return 'badge-abierta'; return 'badge-cerrada'; }
function estadoLbl(e){ const s=String(e||'').toUpperCase(); if(s.indexOf('CERR')===0||s.indexOf('PROC')===0) return '✓ '+e; if(s.indexOf('ABIER')===0||s.indexOf('PEND')===0) return '● '+e; return e||'—'; }
// tags estructurados del comentario de guía (Comprobante: X | Completo: Y | libre)
function tags(c){ const s=String(c||''); const B='(?=\\s|\\||$)'; const has=(k,v)=>new RegExp('(?:^|[\\s|])'+k+':\\s*'+v+B,'i').test(s);
  return { comp: has('comprobante','s[ií]')?'si':has('comprobante','no')?'no':null, compl: has('completo','s[ií]')?'si':has('completo','no')?'no':null }; }
function libre(c){ return String(c||'').replace(/^\s*(?:comprobante:\s*(?:s[ií]|no)\s*\|?\s*)?/i,'').replace(/^\s*(?:completo:\s*(?:s[ií]|no)\s*\|?\s*)?/i,'').replace(/^\s*\|\s*/,'').trim(); }
function buildUrl(tipo,id){ return location.origin+location.pathname+'?tipo='+tipo+'&id='+encodeURIComponent(id); }
function openLb(u){ document.getElementById('lbImg').src=u; document.getElementById('lightbox').classList.add('open'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }
function postit(label,txt){ return '<div class="postit"><div class="pl">✍️ '+esc(label)+'</div><div class="pt">'+esc(txt)+'</div></div>'; }
function header(acc, prov, kindHtml, id, estado){
  return '<div class="rpt-header">'
    + '<div class="rpt-hd-top '+acc+'">'
    + '<div class="rpt-brand">InversionMos · Almacén</div>'
    + '<div class="rpt-prov">'+esc(prov||'—')+'</div>'
    + (kindHtml?('<div class="rpt-kind">'+kindHtml+'</div>'):'')
    + '<div class="rpt-idrow"><span class="rpt-id">'+esc(id)+'</span>'
    + '<span class="badge '+badgeClass(estado)+'" data-key="estado">'+esc(estadoLbl(estado))+'</span></div>'
    + '</div>'
    + '<div class="rpt-live"><span class="dot"></span><span>Reporte en vivo · se actualiza solo</span></div>'
    + '</div>';
}
function fotosSec(fotos){
  if(!fotos||!fotos.length) return '';
  return '<div class="sec" data-key="fotos"><div class="sec-t">📷 Fotos ('+fotos.length+')</div><div class="fotos">'
    + fotos.map(u=>'<img src="'+esc(u)+'" loading="lazy" onclick="openLb(\''+escAttr(u).replace(/'/g,"\\'")+'\')" onerror="this.style.display=\'none\'">').join('')
    + '</div></div>';
}

// ── Render GUÍA ───────────────────────────────────────────────
function renderGuia(d){
  const acc = accentClass(d.tipoGuia,false);
  const tg = tags(d.comentario);
  const marks = [];
  if (tg.compl==='si') marks.push(['✅ Completo','mk-ok']); else if (tg.compl==='no') marks.push(['⚠️ Incompleto','mk-warn']);
  if (tg.comp==='si') marks.push(['🧾 Con comprobante','mk-inv']); else if (tg.comp==='no') marks.push(['Sin comprobante','mk-off']);
  const marksHtml = marks.length ? '<div class="marks">'+marks.map(m=>'<span class="mk '+m[1]+'">'+m[0]+'</span>').join('')+'</div>' : '';
  const lib = libre(d.comentario);
  const notaHtml = lib ? postit('Comentario del operador', lib) : '';

  const det = (d.detalle||[]).filter(x=>String(x.observacion||'')!=='ANULADO');
  let prodHtml = '';
  if (det.length) {
    prodHtml = '<div class="sec" data-key="detalle"><div class="sec-t">📦 Productos ('+det.length+')</div>'
      + det.map(function(it){
          const nuevo=!!it.esProductoNuevo, sinId=!!it.esIncompleto;
          const dot = nuevo?'nw':sinId?'q':'';
          const fl = nuevo?'<span class="fl fl-nw">nuevo</span>':sinId?'<span class="fl fl-q">sin identificar</span>':'';
          const venc = it.fechaVencimiento?('<div class="n2">Vence: '+fmtDate(it.fechaVencimiento)+'</div>'):'';
          const cant = (it.cantidadReal!=null&&it.cantidadReal!=='')?it.cantidadReal:'—';
          return '<div class="it"><span class="dot '+dot+'"></span>'
            + '<div class="nm"><div class="n1">'+esc(it.descripcion||it.codigoProducto)+fl+'</div>'+venc+'</div>'
            + '<span class="qt">'+esc(cant)+' <small>und</small></span></div>';
        }).join('')
      + '</div>';
  }

  // preingreso vinculado
  let preHtml='';
  if (d.idPreingreso) {
    const pi=d.preingreso; const mon=pi?fmtMoney(pi.monto):null;
    const sub=pi?((pi.estado||'')+(mon?' · '+mon:'')+' · '+(pi.nFotos||0)+' foto'+(pi.nFotos===1?'':'s')):'Ver preingreso';
    preHtml='<div class="sec"><div class="sec-t">🔗 Preingreso vinculado</div>'
      + '<a class="linkcard" href="'+esc(buildUrl('preingreso',d.idPreingreso))+'"><span class="lic">🧾</span>'
      + '<span class="lt"><span class="a">'+esc(d.idPreingreso)+'</span><span class="b">'+esc(sub)+'</span></span><span class="go">→</span></a></div>';
  }

  const fotoHtml = d.foto ? '<div class="sec"><div class="sec-t">📷 Foto</div><img class="foto-guia" src="'+esc(d.foto)+'" onclick="openLb(\''+escAttr(d.foto).replace(/'/g,"\\'")+'\')"></div>' : '';

  return header(acc, d.proveedor||d.usuario, tipoLbl(d.tipoGuia), d.idGuia, d.estado)
    + marksHtml
    + notaHtml
    + '<div class="sec"><div class="sec-t">En resumen</div><div class="two">'
    + '<div class="f"><div class="k">Recibido por</div><div class="v">'+esc(d.usuario||'—')+'</div></div>'
    + '<div class="f"><div class="k">Fecha</div><div class="v">'+fmtDate(d.fecha)+'</div></div>'
    + '</div></div>'
    + prodHtml + fotoHtml + preHtml;
}

// ── Render PREINGRESO ─────────────────────────────────────────
function renderPreingreso(d){
  const mon = fmtMoney(d.monto);
  // el comentario del preingreso puede traer el tag estructurado "Comprobante: Sí/No" → mostrarlo como marca,
  // y usar solo el texto LIBRE para la nota (no mostrar "Comprobante: No" como si fuera un comentario).
  const tgp = tags(d.comentario);
  const marks = [];
  if (tgp.comp==='si') marks.push(['🧾 Con comprobante','mk-inv']); else if (tgp.comp==='no') marks.push(['Sin comprobante','mk-off']);
  const marksHtml = marks.length ? '<div class="marks">'+marks.map(m=>'<span class="mk '+m[1]+'">'+m[0]+'</span>').join('')+'</div>' : '';
  const lib = libre(d.comentario);
  const notaHtml = lib ? postit('Nota del preingreso', lib) : '';
  // cargadores: nombres (modelo simple)
  const cargs = (d.cargadores||[]).map(function(c){ return (c&&(c.nombre||c.id))?String(c.nombre||c.id):String(c); }).filter(Boolean);
  const chips = [];
  if (cargs.length) chips.push('🛺 '+cargs.length+' cargador'+(cargs.length===1?'':'es')+' · '+cargs.slice(0,4).join(', ')+(cargs.length>4?'…':''));
  if (d.fotos && d.fotos.length) chips.push('📷 '+d.fotos.length+' foto'+(d.fotos.length===1?'':'s'));
  chips.push('📅 '+fmtDate(d.fecha));
  const chipsHtml = '<div class="chips">'+chips.map(c=>'<span class="chip">'+esc(c)+'</span>').join('')+'</div>';

  // guía vinculada
  let guiaHtml='';
  if (d.idGuia) {
    const g=d.guia;
    const sub=g?((tipoLbl(g.tipo).replace(/^.. /,''))+' · '+(g.estado||'')+' · '+(g.items||0)+' ítems'):'Ver guía';
    guiaHtml='<div class="sec"><div class="sec-t">🔗 Guía vinculada</div>'
      + '<a class="linkcard" href="'+esc(buildUrl('guia',d.idGuia))+'"><span class="lic">📋</span>'
      + '<span class="lt"><span class="a">'+esc(d.idGuia)+'</span><span class="b">'+esc(sub)+'</span></span><span class="go">→</span></a></div>';
  }

  return header('i', d.proveedor||d.usuario, '', d.idPreingreso, d.estado)
    + marksHtml
    + notaHtml
    + '<div class="sec">'
    + (mon?('<div class="money" data-key="monto">'+mon+'<small>monto declarado</small></div>'):'<div class="empty">Sin monto declarado</div>')
    + '<div style="margin-top:12px" data-key="cargadores">'+chipsHtml+'</div>'
    + '<div class="two" style="margin-top:12px">'
    + '<div class="f"><div class="k">Registrado por</div><div class="v">'+esc(d.usuario||'—')+'</div></div>'
    + '<div class="f"><div class="k">Estado</div><div class="v">'+esc(d.estado||'—')+'</div></div>'
    + '</div></div>'
    + fotosSec(d.fotos)
    + guiaHtml;
}

init();
</script>

</html>
